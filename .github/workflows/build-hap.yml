name: Build HAP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup HarmonyOS SDK (API 23 / 26.0.0)
        id: setup
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Prepare build-profile.json5
        run: cp build-profile.template.json5 build-profile.json5

      - name: Install hvigor
        run: |
          npm config set @ohos:registry=https://repo.harmonyos.com/npm/
          npm install --no-save @ohos/hvigor@latest @ohos/hvigor-ohos-plugin@latest

      - name: Inspect SDK layout
        env:
          DEVECO_SDK_HOME: ${{ env.HOS_SDK_HOME }}
        run: |
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          ls -la "$DEVECO_SDK_HOME"
          cat "$DEVECO_SDK_HOME/default/sdk-pkg.json" 2>/dev/null | head -20
          find "$DEVECO_SDK_HOME" -maxdepth 2 -type d | head -40

      - name: Build HAP
        env:
          DEVECO_SDK_HOME: ${{ env.HOS_SDK_HOME }}
        run: |
          node node_modules/@ohos/hvigor/bin/hvigor.js --mode module -p product=default assembleHap --no-daemon

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxmusic-harmony-hap
          path: |
            entry/build/default/outputs/**/*.hap
            entry/build/**/outputs/**/*.hap
          if-no-files-found: error
