name: Build HAP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup HarmonyOS SDK
        id: setup
        uses: harmonyos-dev/setup-harmonyos-sdk@0.2.1
        env:
          JAVA_TOOL_OPTIONS: -Duser.country=CN

      - name: Prepare build-profile.json5
        run: cp build-profile.template.json5 build-profile.json5

      - name: Install hvigor
        run: |
          npm config set @ohos:registry=https://repo.harmonyos.com/npm/
          npm install --no-save @ohos/hvigor@latest @ohos/hvigor-ohos-plugin@latest

      - name: Build HAP
        env:
          HOS_SDK_HOME: ${{ steps.setup.outputs.sdk-path }}
        run: |
          ./node_modules/.bin/hvigor --mode module -p product=default assembleHap --no-daemon

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxmusic-harmony-hap
          path: |
            entry/build/default/outputs/**/*.hap
            entry/build/**/outputs/**/*.hap
          if-no-files-found: error
