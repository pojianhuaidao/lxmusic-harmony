name: Build HAP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup HarmonyOS SDK (API 23 / 26.0.0)
        id: setup
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Prepare build-profile.json5
        run: cp build-profile.template.json5 build-profile.json5

      - name: Install hvigor
        run: |
          npm config set @ohos:registry=https://repo.harmonyos.com/npm/
          npm install --no-save @ohos/hvigor@latest @ohos/hvigor-ohos-plugin@latest

      - name: Inspect SDK layout
        env:
          DEVECO_SDK_HOME: ${{ env.HOS_SDK_HOME }}
        run: |
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          ls -la "$DEVECO_SDK_HOME"
          cat "$DEVECO_SDK_HOME/default/sdk-pkg.json" 2>/dev/null | head -20
          find "$DEVECO_SDK_HOME" -maxdepth 2 -type d | head -40

      - name: Build HAP
        env:
          DEVECO_SDK_HOME: ${{ env.HOS_SDK_HOME }}
        run: |
          node node_modules/@ohos/hvigor/bin/hvigor.js --mode module -p product=default assembleHap --no-daemon

      - name: Rename HAP to <bundleName>-<versionName>-unsigned.hap
        id: rename
        run: |
          set -euo pipefail
          HAP=$(find entry/build -name '*.hap' | head -n 1)
          if [ -z "$HAP" ]; then
            echo "no .hap found in entry/build" >&2
            exit 1
          fi
          BUNDLE=$(grep -o '"bundleName"[[:space:]]*:[[:space:]]*"[^"]*"' AppScope/app.json5 | head -n 1 | sed -E 's/.*"bundleName"[[:space:]]*:[[:space:]]*"([^"]*)"/\1/')
          VERSION=$(grep -o '"versionName"[[:space:]]*:[[:space:]]*"[^"]*"' AppScope/app.json5 | head -n 1 | sed -E 's/.*"versionName"[[:space:]]*:[[:space:]]*"([^"]*)"/\1/')
          if [ -z "$BUNDLE" ]; then
            echo "bundleName not found in AppScope/app.json5" >&2
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "versionName not found in AppScope/app.json5" >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DIR=$(dirname "$HAP")
          mv "$HAP" "$DIR/${BUNDLE}-${VERSION}-unsigned.hap"
          echo "renamed $HAP -> $DIR/${BUNDLE}-${VERSION}-unsigned.hap"
          echo "hap_path=$DIR/${BUNDLE}-${VERSION}-unsigned.hap" >> "$GITHUB_OUTPUT"
          echo "hap_name=${BUNDLE}-${VERSION}-unsigned.hap" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxmusic-harmony-hap
          path: ${{ steps.rename.outputs.hap_path }}
          if-no-files-found: error

      - name: Clean stale Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          KEEP="${{ steps.rename.outputs.hap_name }}"
          # release 可能尚未创建过，容错跳过
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            echo "release tag ${TAG} not found, skip cleanup"
            exit 0
          fi
          echo "release ${RELEASE_ID}, keep asset: ${KEEP}"
          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | "\(.id)\t\(.name)"')
          if [ -z "$ASSETS" ]; then
            echo "no assets, nothing to clean"
            exit 0
          fi
          echo "$ASSETS" | while IFS=$'\t' read -r AID ANAME; do
            if [ "$ANAME" != "$KEEP" ]; then
              echo "deleting stale asset: ${ANAME} (${AID})"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${AID}" >/dev/null
            else
              echo "keeping asset: ${ANAME}"
            fi
          done

      - name: Publish HAP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: lxmusic-harmony ${{ steps.rename.outputs.version_name }} (${{ steps.rename.outputs.short_sha }})
          body: |
            自动构建产物，基于 commit ${{ github.sha }}。
            手机端直接下载 ${{ steps.rename.outputs.hap_name }} 安装。
          files: ${{ steps.rename.outputs.hap_path }}
          fail_on_unmatched_files: true
          allowUpdates: true
