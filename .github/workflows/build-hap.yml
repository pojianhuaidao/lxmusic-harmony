# 版本号规则（硬性构建规则，详见 BUILD_RULES.md；与 AppScope/app.json5 顶部注释一致）：
#   versionName = 1.MMDD.NN   （MMDD=构建月日，NN=当日序号，从 01 开始）
#   versionCode = 1MMDDNN
#   buildVersion = 1MMDDNN（与 versionCode 一致）
# AppScope/app.json5 为唯一版本源，本地与 CI 出包必须一致，不得各自修改。
# 本 workflow 在 Build HAP 步骤前通过 "Auto-generate version" 步骤自动生成版本号并
# 写回 app.json5 三处字段（NN 取 GitHub Release 当日已有资产最大序号 +1），禁止手动改动。
name: Build & Release (HAP + APP zip)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup HarmonyOS SDK (API 23 / 26.0.0)
        id: setup
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Prepare build-profile.json5
        run: cp build-profile.template.json5 build-profile.json5

      - name: Install hvigor
        run: |
          npm config set @ohos:registry=https://repo.harmonyos.com/npm/
          npm install --no-save @ohos/hvigor@latest @ohos/hvigor-ohos-plugin@latest

      - name: Install project dependencies (ohpm)
        run: |
          set -euo pipefail
          OHPM="$(dirname "${HOS_SDK_HOME}")/ohpm/bin/ohpm"
          if [ ! -f "$OHPM" ]; then
            echo "ohpm not found at $OHPM (HOS_SDK_HOME=${HOS_SDK_HOME})" >&2
            exit 1
          fi
          "$OHPM" config set registry https://ohpm.openharmony.cn/ohpm/
          "$OHPM" install

      - name: Auto-generate version (1.MMDD.NN) & write AppScope/app.json5
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MMDD=$(date +%m%d)
          # 当日序号 NN：查 GitHub Release(latest) 当日已有资产（music_1.MMDD.NN_*）的最大 NN +1，无则 01
          MAX_NN=0
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | .name' 2>/dev/null || true)
            for A in $ASSETS; do
              if [[ "$A" =~ music_1\.${MMDD}\.([0-9]{2})_ ]]; then
                N=$((10#${BASH_REMATCH[1]}))
                if [ "$N" -gt "$MAX_NN" ]; then MAX_NN="$N"; fi
              fi
            done
          fi
          NN=$((MAX_NN + 1))
          if [ "$NN" -lt 1 ]; then NN=1; fi
          if [ "$NN" -gt 99 ]; then echo "daily build count exceeds 99 (NN=$NN)" >&2; exit 1; fi
          NNSTR=$(printf "%02d" "$NN")
          VERNAME="1.${MMDD}.${NNSTR}"
          VERCODE="1${MMDD}${NNSTR}"
          python3 tools/ci/write_version.py "$VERNAME" "$VERCODE"
          echo "version_name=${VERNAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERCODE}" >> "$GITHUB_OUTPUT"
          echo "==> auto version: versionName=${VERNAME} / versionCode=${VERCODE} / buildVersion=${VERCODE} (写入 AppScope/app.json5)"

      - name: Build HAP
        env:
          DEVECO_SDK_HOME: ${{ env.HOS_SDK_HOME }}
        run: |
          # 显式指定 release 构建模式：正式包走 release（关闭调试符号/不走 debug 分支）
          node node_modules/@ohos/hvigor/bin/hvigor.js --mode module -p product=default -p buildMode=release assembleHap --no-daemon

      - name: Restore signing key from secrets
        env:
          LXMUSIC_KEY_B64: ${{ secrets.LXMUSIC_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$LXMUSIC_KEY_B64" ]; then
            echo "secrets.LXMUSIC_KEY_B64 not configured -> unsigned only" >&2
            exit 0
          fi
          echo "$LXMUSIC_KEY_B64" | base64 -d > /tmp/music_key.zip
          mkdir -p key
          (cd key && unzip -o -q /tmp/music_key.zip)
          ls -la key/

      - name: Locate unsigned HAP & read version
        id: meta
        run: |
          set -euo pipefail
          HAP=$(find entry/build -name '*unsigned.hap' | head -n 1)
          if [ -z "$HAP" ]; then
            HAP=$(find entry/build -name '*.hap' ! -name '*-signed.hap' | head -n 1)
          fi
          if [ -z "$HAP" ]; then
            echo "no unsigned hap found" >&2
            exit 1
          fi
          VERSION=$(grep -o '"versionName"[[:space:]]*:[[:space:]]*"[^"]*"' AppScope/app.json5 | head -n 1 | sed -E 's/.*"versionName"[[:space:]]*:[[:space:]]*"([^"]*)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "versionName not found" >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "hap_path=$HAP" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Sign HAP & assemble APP & bundle zip
        id: bundle
        env:
          HOS_SDK_HOME: ${{ env.HOS_SDK_HOME }}
          LXMUSIC_KEY_PASS: ${{ secrets.LXMUSIC_KEY_PASS }}
          HAS_KEY: ${{ secrets.LXMUSIC_KEY_B64 != '' }}
        run: |
          set -euo pipefail
          HAP="${{ steps.meta.outputs.hap_path }}"
          VER="${{ steps.meta.outputs.version_name }}"
          SHORT="${{ steps.meta.outputs.short_sha }}"
          UNSIGNED="music_${VER}_unsigned.hap"
          SIGNED="entry-default-signed.hap"
          APP="music_${VER}_release.app"
          ZIP="music_${VER}_${SHORT}_release.zip"
          PACK_INFO="entry/build/default/outputs/default/pack.info"
          mkdir -p dist
          cp "$HAP" "dist/${UNSIGNED}"
          if [ "$HAS_KEY" = "true" ]; then
            CERT=$(ls key/*.cer | head -n1)
            PROFILE=$(ls key/*.p7b | head -n1)
            java -jar tools/sign/hap-sign-tool.jar sign-app \
              -mode localSign \
              -keyAlias lxmusic -keyPwd "$LXMUSIC_KEY_PASS" \
              -appCertFile "$CERT" -profileFile "$PROFILE" \
              -keystoreFile key/lxmusic.p12 -keystorePwd "$LXMUSIC_KEY_PASS" \
              -signAlg SHA256withECDSA \
              -inFile "$HAP" -outFile "dist/${SIGNED}"
            APK_TOOL=$(find "${HOS_SDK_HOME}" -name app_packing_tool.jar | head -n1)
            if [ -z "$APK_TOOL" ]; then
              echo "app_packing_tool.jar not found in SDK" >&2
              exit 1
            fi
            python3 tools/ci/assemble_bundle.py assemble-app "dist/${SIGNED}" "$PACK_INFO" "$APK_TOOL" "dist/${APP}_raw.app"
            java -jar tools/sign/hap-sign-tool.jar sign-app \
              -mode localSign \
              -keyAlias lxmusic -keyPwd "$LXMUSIC_KEY_PASS" \
              -appCertFile "$CERT" -profileFile "$PROFILE" \
              -keystoreFile key/lxmusic.p12 -keystorePwd "$LXMUSIC_KEY_PASS" \
              -signAlg SHA256withECDSA \
              -inFile "dist/${APP}_raw.app" -outFile "dist/${APP}"
            rm -f "dist/${APP}_raw.app"
            echo "signed app built"
          else
            echo "secrets.LXMUSIC_KEY_B64 not configured -> skip signing"
          fi
          python3 tools/ci/assemble_bundle.py bundle-zip "dist/${UNSIGNED}" "dist/${APP}" "dist/${ZIP}"
          ls -la dist/
          echo "zip_path=dist/${ZIP}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-harmony-release
          path: ${{ steps.bundle.outputs.zip_path }}
          if-no-files-found: error

      - name: Clean stale Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          KEEP="${{ steps.bundle.outputs.zip_name }}"
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            echo "release tag ${TAG} not found, skip cleanup"
            exit 0
          fi
          echo "release ${RELEASE_ID}, keep asset: ${KEEP}"
          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | "\(.id)\t\(.name)"')
          if [ -z "$ASSETS" ]; then
            echo "no assets, nothing to clean"
            exit 0
          fi
          echo "$ASSETS" | while IFS=$'\t' read -r AID ANAME; do
            if [ "$ANAME" != "$KEEP" ]; then
              echo "deleting stale asset: ${ANAME} (${AID})"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${AID}" >/dev/null
            else
              echo "keeping asset: ${ANAME}"
            fi
          done

      - name: Publish zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 听·音乐 ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.short_sha }})
          body: |
            自动构建产物，基于 commit ${{ github.sha }}。

            压缩包内包含两个版本：
            - **music_${{ steps.meta.outputs.version_name }}_unsigned.hap**：未签名 HAP，侧载/自装用
            - **music_${{ steps.meta.outputs.version_name }}_release.app**：已签名 APP，AGC 测试分发用（AGC 仅支持 app，不支持 hap）

            下载 zip 解压后，按需使用对应文件。
          files: ${{ steps.bundle.outputs.zip_path }}
          fail_on_unmatched_files: true
          allowUpdates: true
